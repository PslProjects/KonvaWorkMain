<div class="login-wrapper">
  <div class="login-box">
    <h1 class="title">Admin Login</h1>

    <form (ngSubmit)="loginAdmin()" class="login-form">
      <input
        type="text"
        placeholder="Admin Username"
        [(ngModel)]="username"
        name="adminUsername"
        class="input-field"
        required
      />

      <input
        type="password"
        placeholder="Admin Password"
        [(ngModel)]="password"
        name="adminPassword"
        class="input-field"
        required
      />

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="login-btn">Login as Admin</button>
    </form>

    <!-- NEW BUTTON TO CREATE ADMIN -->
    <button (click)="goToAddAdmin()" class="add-btn">
      Add Admin
    </button>

  </div>
</div>
